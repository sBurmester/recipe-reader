services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recipes}
      POSTGRES_USER: ${POSTGRES_USER:-recipes}
      # No default, deliberately. This used to be the literal "recipes" for
      # user "recipes" on database "recipes" — a convenience on a laptop, and
      # an internet-exposed database with a three-way-guessable credential the
      # moment a working compose file is copied to a VPS. Compose now refuses
      # to start without one, which is how API_TOKEN and the Instagram and
      # Anthropic credentials are already handled below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD - there is no default}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback, not every interface. The app reaches db by name over the
      # compose network and needs no published port at all; this one exists
      # only so `make db-up` can serve a locally run binary, and binding it to
      # 0.0.0.0 published the database to the network on the same command.
      # sslmode=disable in the DSN below is correct for the compose network and
      # wrong the moment the database is not local, which is the other reason
      # not to publish it.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipes}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # Stamped into the binary so `docker compose exec app recipe-reader
        # --version` and /api/healthz report what is running. Compose has no
        # git either, so pass it in: VERSION=$(git describe --tags --always
        # --dirty) docker compose up --build.
        VERSION: ${VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Built from the same variables the db service uses, so the two cannot
      # drift. Set DB_DSN yourself to override it wholesale — which is also the
      # answer for a password carrying characters a URL would have to
      # percent-encode.
      DB_DSN: ${DB_DSN:-postgres://${POSTGRES_USER:-recipes}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recipes}?sslmode=disable}
      # The container has to bind every interface for the published port to
      # reach it, which is exactly the network-reachable case the server
      # refuses to start in without a token. Compose fails first, with a
      # message that says what to set.
      HTTP_ADDR: ":8080"
      API_TOKEN: ${API_TOKEN:?set API_TOKEN - the published port exposes the write endpoints to anything that can route to it}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}
      INSTAGRAM_COLLECTION: ${INSTAGRAM_COLLECTION:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    # The Instagram session file lives under the default relative path
    # data/instagram-session.json; persisting it across restarts is what keeps
    # the app from logging in again every boot, which Instagram rate-limits.
    volumes:
      - app-data:/app/data

volumes:
  db-data:
  app-data:
