services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: "postgres://recipes:recipes@db:5432/recipes?sslmode=disable"
      # The container has to bind every interface for the published port to
      # reach it, which is exactly the network-reachable case the server
      # refuses to start in without a token. Compose fails first, with a
      # message that says what to set.
      HTTP_ADDR: ":8080"
      API_TOKEN: ${API_TOKEN:?set API_TOKEN - the published port exposes the write endpoints to anything that can route to it}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}
      INSTAGRAM_COLLECTION: ${INSTAGRAM_COLLECTION:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    # The Instagram session file lives under the default relative path
    # data/instagram-session.json; persisting it across restarts is what keeps
    # the app from logging in again every boot, which Instagram rate-limits.
    volumes:
      - app-data:/app/data

volumes:
  db-data:
  app-data:
