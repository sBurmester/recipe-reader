name: CI

# Changes that cannot affect what the jobs below assert do not start them. The
# backend job alone boots several Postgres containers, so a plan or a README
# edit used to cost real minutes and a queue slot to prove nothing.
#
# paths-ignore skips a run only when *every* changed file matches, so a commit
# that touches code and its README still runs in full. The repository has no
# required status checks (branch protection is unavailable on this plan), so a
# skipped run leaves nothing pending and blocks no merge.
#
# The workflow file ignores itself: a change to it is therefore merged without
# ever having run. workflow_dispatch below is the way back in — run it by hand
# from the Actions tab after a non-trivial edit, or put the edit on a branch
# that also touches code.
#
# The two lists are duplicated because GitHub Actions does not expand YAML
# anchors; keep them in step.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/**"

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete. The backend
# job starts real Postgres containers, so cancelling early saves real minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"

      # internal/db/sqlc is generated and committed, so it can silently drift
      # from the queries and migrations it was generated from. Regenerating and
      # diffing is what keeps the committed output honest.
      #
      # `go tool sqlc` pins the generator to the version in go.mod, which is
      # the same one `make sqlc-generate` runs. With sqlc@latest here, an
      # upstream release that changed generated output failed this gate on
      # every open PR at once, with no repository change to explain it.
      - name: sqlc generated code is up to date
        run: |
          go tool sqlc generate
          if [ -n "$(git status --porcelain -- internal/db/sqlc)" ]; then
            git status --porcelain -- internal/db/sqlc
            git diff -- internal/db/sqlc
            echo "::error::internal/db/sqlc is stale - run 'make sqlc-generate' and commit the result"
            exit 1
          fi

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Every package whose TestMain calls testdb.Main starts one ephemeral
      # Postgres container via testcontainers-go, shared across the package's
      # tests (see internal/db/testdb). ubuntu-latest runners have Docker
      # natively, so no services: block is needed.
      - name: go test
        # -coverprofile, and nothing that gates on the result. A threshold
        # produces tests written to move a number; the per-package percentages
        # go test prints, plus the total below and the uploaded profile, are the
        # visibility D6 asked for without that incentive.
        run: go test ./... -race -coverprofile=cover.out -covermode=atomic

      - name: Coverage summary
        run: |
          go tool cover -func=cover.out | tail -n 1
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=cover.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept even when the tests fail: a coverage profile is most useful on the
      # run that went wrong.
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  # Builds the frontend and the binary from scratch in the image, so this
  # catches Dockerfile drift that neither job above would see.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # git describe needs tags and history; the default shallow checkout
          # has neither, and the image would stamp itself with a bare SHA or
          # "dev".
          fetch-depth: 0
      - name: Build image
        run: |
          echo "VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          docker build \
            --build-arg VERSION="$(git describe --tags --always --dirty)" \
            -t recipe-reader:ci .

      # Building catches Dockerfile drift; running catches what comes after it.
      # The script starts the image against a throwaway Postgres and checks
      # that it answers its health check, that a database-backed route works
      # (so the migrations ran), and that / is the real frontend rather than the
      # placeholder a build without it embeds - the failure a green build here
      # used to let through.
      - name: Smoke-test the image
        # The version is passed through so the script asserts the exact stamp
        # this build was given, not merely that something other than "dev"
        # came back.
        run: scripts/smoke-test-image.sh recipe-reader:ci "$VERSION"
