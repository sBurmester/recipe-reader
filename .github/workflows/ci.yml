name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete. The backend
# job starts real Postgres containers, so cancelling early saves real minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # internal/db/sqlc is generated and committed, so it can silently drift
      # from the queries and migrations it was generated from. Regenerating and
      # diffing is what keeps the committed output honest.
      - name: sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate
          if [ -n "$(git status --porcelain -- internal/db/sqlc)" ]; then
            git status --porcelain -- internal/db/sqlc
            git diff -- internal/db/sqlc
            echo "::error::internal/db/sqlc is stale - run 'make sqlc-generate' and commit the result"
            exit 1
          fi

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # internal/db, internal/repository, internal/pipeline and internal/api
      # each start one ephemeral Postgres container via testcontainers-go,
      # shared across the package's tests (see internal/db/testdb).
      # ubuntu-latest runners have Docker natively, so no services: block is
      # needed.
      - name: go test
        run: go test ./... -race

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  # Builds the frontend and the binary from scratch in the image, so this
  # catches Dockerfile drift that neither job above would see.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t recipe-reader:ci .
