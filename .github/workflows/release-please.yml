name: Release Please

# Runs on every push to main and keeps a release PR open that shows the next
# version and the changelog it would write. Merging that PR is what creates the
# tag and the GitHub release.
#
# The PR and the release are made with GITHUB_TOKEN, which needs the repository
# setting "Allow GitHub Actions to create and approve pull requests". It also
# means neither of them triggers another workflow: a release made this way
# fires no `release` event anywhere else, which is why the artifacts job below
# calls release-artifacts.yml directly instead of that workflow listening.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
